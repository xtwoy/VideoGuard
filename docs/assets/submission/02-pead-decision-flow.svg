<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
<title id="title">PEAD 证据约束决策流程</title><desc id="desc">从结构化观察到证据规范化、论证节点、攻击关系、grounded 求解、规则裁决和报告留痕。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#54718A"/></marker><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#183247}.title{font-size:34px;font-weight:700;fill:#17324D}.sub{font-size:17px;fill:#5B7182}.head{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#4C6274}.edge{stroke:#54718A;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs>
<rect width="1600" height="930" fill="#FFFFFF"/><text x="70" y="66" class="title">PEAD｜从证据到处置的约束链</text><text x="70" y="100" class="sub">拆分“看到了什么”“它们是否相关”“能否形成风险结论”。</text>
<rect x="70" y="150" width="320" height="150" rx="18" fill="#E8F1FA" stroke="#8BAECD" stroke-width="2"/><text x="230" y="190" text-anchor="middle" class="head">① 结构化观察输入</text><text x="230" y="225" text-anchor="middle" class="body">Fact / Cue / Event / Relation</text><text x="230" y="255" text-anchor="middle" class="body">来源 · 时间 · 置信信息</text><text x="230" y="280" text-anchor="middle" class="small">机器观察不等于已核实事实</text>
<rect x="450" y="150" width="320" height="150" rx="18" fill="#E8F1FA" stroke="#8BAECD" stroke-width="2"/><text x="610" y="190" text-anchor="middle" class="head">② 证据规范化</text><text x="610" y="225" text-anchor="middle" class="body">检查引用与时间范围</text><text x="610" y="255" text-anchor="middle" class="body">同源合并 · 事件隔离</text><text x="610" y="280" text-anchor="middle" class="small">无效引用不进入支持链</text>
<rect x="830" y="150" width="320" height="150" rx="18" fill="#DDF3EF" stroke="#62A99D" stroke-width="2"/><text x="990" y="190" text-anchor="middle" class="head">③ 生成论证节点</text><text x="990" y="225" text-anchor="middle" class="body">SUPPORT · COUNTER</text><text x="990" y="255" text-anchor="middle" class="body">UNCERTAINTY</text><text x="990" y="280" text-anchor="middle" class="small">保留前提证据与规则 ID</text>
<rect x="1210" y="150" width="320" height="150" rx="18" fill="#DDF3EF" stroke="#62A99D" stroke-width="2"/><text x="1370" y="190" text-anchor="middle" class="head">④ 构建攻击关系</text><text x="1370" y="225" text-anchor="middle" class="body">先生成全部节点</text><text x="1370" y="255" text-anchor="middle" class="body">再按作用域建立攻击边</text><text x="1370" y="280" text-anchor="middle" class="small">不依赖规则执行顺序</text>
<path d="M390 225 H440" class="edge"/><path d="M770 225 H820" class="edge"/><path d="M1150 225 H1200" class="edge"/>
<rect x="260" y="390" width="330" height="150" rx="18" fill="#F0ECFA" stroke="#A69ACB" stroke-width="2"/><text x="425" y="430" text-anchor="middle" class="head">⑤ Grounded 求解</text><text x="425" y="465" text-anchor="middle" class="body">PyArg：IN / OUT / UNDECIDED</text><text x="425" y="495" text-anchor="middle" class="body">NetworkX：结构与关系解释</text><text x="425" y="520" text-anchor="middle" class="small">求解标签不是最终处置</text>
<rect x="635" y="390" width="330" height="150" rx="18" fill="#FFF2D6" stroke="#D9B45D" stroke-width="2"/><text x="800" y="430" text-anchor="middle" class="head">⑥ 显式规则裁决</text><text x="800" y="465" text-anchor="middle" class="body">支持 · 冲突 · 未知 · 覆盖</text><text x="800" y="495" text-anchor="middle" class="body">按优先级选规则并记录轨迹</text><text x="800" y="520" text-anchor="middle" class="small">规则加载时检查完整性</text>
<rect x="1010" y="390" width="330" height="150" rx="18" fill="#EEF3F7" stroke="#9CB0C0" stroke-width="2"/><text x="1175" y="430" text-anchor="middle" class="head">⑦ 审核状态输出</text><text x="1175" y="465" text-anchor="middle" class="body">SUPPORTED / CONFLICTED</text><text x="1175" y="495" text-anchor="middle" class="body">UNKNOWN / INSUFFICIENT</text><text x="1175" y="520" text-anchor="middle" class="small">判断与处置分离</text>
<path d="M1370 300 V350 H425 V380" class="edge"/><path d="M590 465 H625" class="edge"/><path d="M965 465 H1000" class="edge"/>
<rect x="260" y="610" width="1080" height="105" rx="16" fill="#F7F9FB" stroke="#9CB0C0" stroke-width="2"/><text x="800" y="650" text-anchor="middle" class="head">⑧ 报告校验与审计留痕</text><text x="800" y="683" text-anchor="middle" class="body">证据 ID + 时间定位 + 置信/反向信息 + 原因码 + 规则轨迹 + 人工复核要求</text><path d="M1175 540 V580 H800 V600" class="edge"/>
<rect x="70" y="770" width="1460" height="95" rx="16" fill="#FFF7E8" stroke="#D9B45D" stroke-width="2"/><text x="105" y="808" class="head">保守原则</text><text x="105" y="840" class="body">明确 unrelated 可以否定候选关系；未核验不等于 unrelated。缺模态、事件冲突或求解超限时保留未知/复核。</text><text x="70" y="900" class="small">注：grounded 语义和图算法为既有方法/第三方组件；项目贡献在领域映射、约束规则与可追溯裁决。</text></svg>