<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">VideoGuard-E 系统总体架构</title><desc id="desc">视频上传、事实解析、线索定位、关系核验、PEAD 决策、报告校验、数据库与前端的数据流。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#54718A"/></marker><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#183247}.title{font-size:34px;font-weight:700;fill:#17324D}.sub{font-size:17px;fill:#5B7182}.head{font-size:22px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#4C6274}.card{stroke-width:2;rx:18}.edge{stroke:#54718A;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs>
<rect width="1600" height="1000" fill="#FFFFFF"/><text x="70" y="68" class="title">视鉴 VideoGuard-E｜系统总体架构</text><text x="70" y="102" class="sub">模型提供结构化观察，程序约束证据关系与处置；报告保留来源、时间与不确定性。</text>
<rect x="65" y="150" width="220" height="188" fill="#EEF3F7" stroke="#9CB0C0" class="card"/><text x="175" y="190" text-anchor="middle" class="head">上传与校验</text><text x="175" y="225" text-anchor="middle" class="body">授权 · 文件校验</text><text x="175" y="253" text-anchor="middle" class="body">时长读取（ffprobe）</text><text x="175" y="296" text-anchor="middle" class="small">无效输入 → 明确失败</text>
<rect x="325" y="150" width="220" height="188" fill="#E8F1FA" stroke="#8BAECD" class="card"/><text x="435" y="190" text-anchor="middle" class="head">阶段一</text><text x="435" y="222" text-anchor="middle" class="head">事实解析</text><text x="435" y="258" text-anchor="middle" class="body">分镜 · 事实 · 事件</text><text x="435" y="286" text-anchor="middle" class="body">覆盖 · 时间范围</text>
<rect x="585" y="150" width="220" height="188" fill="#E8F1FA" stroke="#8BAECD" class="card"/><text x="695" y="190" text-anchor="middle" class="head">阶段二</text><text x="695" y="222" text-anchor="middle" class="head">线索定位</text><text x="695" y="258" text-anchor="middle" class="body">策略标签 · 置信度</text><text x="695" y="286" text-anchor="middle" class="body">引用 · 事件作用域</text>
<rect x="845" y="150" width="220" height="188" fill="#E8F1FA" stroke="#8BAECD" class="card"/><text x="955" y="190" text-anchor="middle" class="head">阶段三</text><text x="955" y="222" text-anchor="middle" class="head">关系核验</text><text x="955" y="258" text-anchor="middle" class="body">鼓励 / 警示同事件</text><text x="955" y="286" text-anchor="middle" class="body">无关 / 信息不足</text>
<rect x="1105" y="140" width="220" height="208" fill="#DDF3EF" stroke="#62A99D" stroke-width="3" rx="18"/><text x="1215" y="181" text-anchor="middle" class="head">阶段三点五</text><text x="1215" y="213" text-anchor="middle" class="head">PEAD</text><text x="1215" y="249" text-anchor="middle" class="body">证据规范化</text><text x="1215" y="276" text-anchor="middle" class="body">论证构图与求解</text><text x="1215" y="303" text-anchor="middle" class="body">规则裁决与轨迹</text>
<rect x="1365" y="150" width="180" height="188" fill="#FFF2D6" stroke="#D9B45D" class="card"/><text x="1455" y="190" text-anchor="middle" class="head">阶段四</text><text x="1455" y="222" text-anchor="middle" class="head">报告校验</text><text x="1455" y="258" text-anchor="middle" class="body">审核问题 · 证据</text><text x="1455" y="286" text-anchor="middle" class="body">复核 · 整改建议</text>
<path d="M285 244 H316" class="edge"/><path d="M545 244 H576" class="edge"/><path d="M805 244 H836" class="edge"/><path d="M1065 244 H1096" class="edge"/><path d="M1325 244 H1356" class="edge"/>
<rect x="1105" y="385" width="440" height="94" fill="#F4FAF8" stroke="#62A99D" stroke-width="2" rx="14"/><text x="1325" y="420" text-anchor="middle" class="head">PEAD 的能力边界</text><text x="1325" y="450" text-anchor="middle" class="body">约束证据如何支持结论，不证明上游观察真实</text><path d="M1215 348 V375" class="edge"/>
<rect x="65" y="540" width="465" height="150" fill="#F7F9FB" stroke="#9CB0C0" class="card"/><text x="297" y="580" text-anchor="middle" class="head">持久化层</text><text x="297" y="615" text-anchor="middle" class="body">SQLite：审核记录与必要元信息</text><text x="297" y="646" text-anchor="middle" class="body">不存储原始视频二进制</text>
<rect x="568" y="540" width="465" height="150" fill="#F7F9FB" stroke="#9CB0C0" class="card"/><text x="800" y="580" text-anchor="middle" class="head">前端工作台</text><text x="800" y="615" text-anchor="middle" class="body">结论 · 时间线 · 风险项</text><text x="800" y="646" text-anchor="middle" class="body">证据追溯 · 人工复核 · 整改</text>
<rect x="1070" y="540" width="475" height="150" fill="#F7F9FB" stroke="#9CB0C0" class="card"/><text x="1307" y="580" text-anchor="middle" class="head">可离线查看的网页报告</text><text x="1307" y="615" text-anchor="middle" class="body">离线查看 · 证据编号与时间定位</text><text x="1307" y="646" text-anchor="middle" class="body">显示未知状态、低置信与复核要求</text>
<path d="M1455 338 V505 H297 V530" class="edge"/><path d="M530 615 H558" class="edge"/><path d="M1033 615 H1060" class="edge"/>
<rect x="65" y="755" width="1480" height="120" fill="#FFF7E8" stroke="#D9B45D" stroke-width="2" rx="16"/><text x="100" y="795" class="head">贯穿全链路的失败原则</text><text x="100" y="832" class="body">协议无效、证据越界、关系未核验、必需模态缺失或求解超限，不得静默变成“没有风险”。</text><text x="70" y="930" class="small">注：依据项目设计整理的架构示意；定稿前应与最终交付版本的代码和接口复核。</text></svg>