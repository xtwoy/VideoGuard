<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">跨事件关系冲突的论证示意</title><desc id="desc">关系模型错误关联两个不同事件时，事件标识冲突形成反向论证，攻击模型支持节点，最终转人工复核。</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#54718A"/></marker><marker id="redarrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#C34D4D"/></marker><style>
text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;fill:#183247}.title{font-size:34px;font-weight:700;fill:#17324D}.sub{font-size:17px;fill:#5B7182}.head{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#4C6274}.edge{stroke:#54718A;stroke-width:3;fill:none;marker-end:url(#arrow)}.attack{stroke:#C34D4D;stroke-width:4;fill:none;marker-end:url(#redarrow)}
</style></defs>
<rect width="1600" height="900" fill="#FFFFFF"/><text x="70" y="66" class="title">PEAD｜跨事件误关联如何被约束</text><text x="70" y="100" class="sub">示意：关系服务将事件 A 的动作与事件 B 的话语错误判断为同一事件。</text>
<rect x="70" y="160" width="330" height="170" rx="18" fill="#E8F1FA" stroke="#8BAECD" stroke-width="2"/><text x="235" y="202" text-anchor="middle" class="head">事件 A：动作线索</text><text x="235" y="240" text-anchor="middle" class="body">event_id = event_A</text><text x="235" y="270" text-anchor="middle" class="body">证据 E01 · 00:03–00:07</text><text x="235" y="300" text-anchor="middle" class="small">危险动作候选</text>
<rect x="70" y="420" width="330" height="170" rx="18" fill="#E8F1FA" stroke="#8BAECD" stroke-width="2"/><text x="235" y="462" text-anchor="middle" class="head">事件 B：话语线索</text><text x="235" y="500" text-anchor="middle" class="body">event_id = event_B</text><text x="235" y="530" text-anchor="middle" class="body">证据 E08 · 00:19–00:23</text><text x="235" y="560" text-anchor="middle" class="small">另一段话语候选</text>
<rect x="490" y="260" width="300" height="190" rx="18" fill="#FFF2D6" stroke="#D9B45D" stroke-width="2"/><text x="640" y="305" text-anchor="middle" class="head">关系服务回答</text><text x="640" y="345" text-anchor="middle" class="body">encourages_same</text><text x="640" y="375" text-anchor="middle" class="body">confidence = 0.99</text><text x="640" y="415" text-anchor="middle" class="small">高置信度不代表结构正确</text>
<path d="M400 245 H450 V310 H480" class="edge"/><path d="M400 505 H450 V400 H480" class="edge"/>
<rect x="880" y="160" width="300" height="170" rx="18" fill="#FBE7E7" stroke="#D58B8B" stroke-width="2"/><text x="1030" y="202" text-anchor="middle" class="head">COUNTER</text><text x="1030" y="240" text-anchor="middle" class="body">事件指向不一致</text><text x="1030" y="270" text-anchor="middle" class="body">event_A ≠ event_B</text><text x="1030" y="300" text-anchor="middle" class="small">结构性反向论证</text>
<rect x="880" y="420" width="300" height="170" rx="18" fill="#F0ECFA" stroke="#A69ACB" stroke-width="2"/><text x="1030" y="462" text-anchor="middle" class="head">MODEL_PROMOTION</text><text x="1030" y="500" text-anchor="middle" class="body">关系回答产生的支持节点</text><text x="1030" y="530" text-anchor="middle" class="body">不是新的原始事实</text><text x="1030" y="560" text-anchor="middle" class="small">仍需接受结构约束</text>
<path d="M790 355 H835 V245 H870" class="edge"/><path d="M790 355 H835 V505 H870" class="edge"/><path d="M1030 330 V410" class="attack"/>
<rect x="1250" y="250" width="280" height="230" rx="18" fill="#DDF3EF" stroke="#62A99D" stroke-width="2"/><text x="1390" y="292" text-anchor="middle" class="head">求解与裁决</text><text x="1390" y="332" text-anchor="middle" class="body">COUNTER：IN</text><text x="1390" y="362" text-anchor="middle" class="body">模型支持受攻击</text><text x="1390" y="402" text-anchor="middle" class="body">保留结构冲突</text><text x="1390" y="442" text-anchor="middle" class="small">CONFLICTED / REVIEW</text><path d="M1180 245 H1220 V300 H1240" class="edge"/><path d="M1180 505 H1220 V430 H1240" class="edge"/>
<rect x="70" y="670" width="1460" height="115" rx="16" fill="#F7F9FB" stroke="#9CB0C0" stroke-width="2"/><text x="105" y="712" class="head">这个例子说明什么</text><text x="105" y="748" class="body">关系回答必须与事件作用域、时间和证据引用相容；发生结构冲突时，系统保留冲突并转人工复核。</text><text x="70" y="835" class="small">注：结构示意图，非视频截图。E01/E08 与 event_A/event_B 是示例标识，不是真实样本。</text></svg>